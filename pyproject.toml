[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "middleout-lattice"
version = "0.1.0"
description = "Lossless, model-agnostic compression for LLM weights and archives"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "AmSach", email = "amansachan92905@gmail.com"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["middleout_lattice*"]
